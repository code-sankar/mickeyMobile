<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFE01F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Mickey Mobile | Phone Repair, New &amp; Refurbished Devices, Accessories in Tinsukia</title>
    <meta
      name="description"
      content="Same-day screen and battery repair with a 90-day warranty, new and certified refurbished phones, and premium accessories — all under one roof at Mickey Mobile, TDA Market, Tinsukia."
    />
    <link rel="canonical" href="https://mickeymobile.in/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mickey Mobile" />
    <meta property="og:title" content="Mickey Mobile | Fast Device Repair &amp; Premium Gear Under One Roof" />
    <meta
      property="og:description"
      content="Free diagnostics, same-day repairs, 90-day warranty. Sales, service and accessories for Apple, Samsung, Google, OnePlus and Nothing."
    />
    <meta property="og:url" content="https://mickeymobile.in/" />
    <meta property="og:image" content="https://mickeymobile.in/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Local SEO: LocalBusiness structured data.

      No aggregateRating here on purpose. Google does not allow a business to
      mark up its own review scores (self-serving review markup), and the
      figures the site shows come from the live Places response at runtime,
      which a crawler reading this static file would not see. The rating in
      search results comes from the Google Business Profile itself.

      geo is Tinsukia town centre, not TDA Market's exact rooftop — replace
      with the precise pin from the Google Business Profile before launch.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobilePhoneStore",
        "name": "Mickey Mobile",
        "image": "https://mickeymobile.in/og-cover.jpg",
        "@id": "https://mickeymobile.in/#store",
        "url": "https://mickeymobile.in/",
        "hasMap": "https://maps.google.com/?cid=2721419290466753029",
        "sameAs": ["https://maps.google.com/?cid=2721419290466753029"],
        "telephone": "+91-98765-43210",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "2nd Floor, Shop No 258, TDA Market",
          "addressLocality": "Tinsukia",
          "addressRegion": "Assam",
          "postalCode": "786125",
          "addressCountry": "IN"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 27.4898, "longitude": 95.3599 },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "10:00",
            "closes": "20:30"
          },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "10:00", "closes": "21:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "11:00", "closes": "18:00" }
        ],
        "department": [
          { "@type": "Service", "name": "Screen replacement" },
          { "@type": "Service", "name": "Battery replacement" },
          { "@type": "Service", "name": "Water damage recovery" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
